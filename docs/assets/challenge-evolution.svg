<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="barMotion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barPlan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="520" rx="16" fill="url(#bg2)"/>
  <rect x="16" y="16" width="1048" height="488" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700">从 v30 到 v48：关键技术攻坚时间线与 v48 实测诊断剖析</text>
  <text x="40" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13">每一次迭代均源于实测失败证据，转化成离线可回放的 RGB-D / 轨迹回归夹具（累计 202 项回归测试 100% 通过）</text>

  <!-- Timeline Line -->
  <line x1="65" y1="138" x2="1015" y2="138" stroke="#475569" stroke-width="3"/>

  <!-- Node 1: v30-v35 -->
  <circle cx="110" cy="138" r="10" fill="#38bdf8" stroke="#0f172a" stroke-width="3"/>
  <text x="110" y="116" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">v30 → v35</text>
  <rect x="35" y="160" width="175" height="125" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="47" y="184" fill="#f8fafc" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">分拣顺序与基础闭环</text>
  <text x="47" y="206" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 切换为 A 优先分拣策略</text>
  <text x="47" y="226" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 解决 A 下降净空与腕部饱和</text>
  <text x="47" y="246" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 0.08 rad 腕关节释放余量</text>
  <text x="47" y="270" fill="#94a3b8" font-family="monospace" font-size="11">阶段进展: 5/6 (A2/B2/C1)</text>

  <!-- Node 2: v36-v38 -->
  <circle cx="320" cy="138" r="10" fill="#2dd4bf" stroke="#0f172a" stroke-width="3"/>
  <text x="320" y="116" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="14" font-weight="700">v36 → v38</text>
  <rect x="228" y="160" width="185" height="125" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="240" y="184" fill="#f8fafc" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">C 件抓前检查与细密扫掠</text>
  <text x="240" y="206" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 取消不执行的固定高位抬升</text>
  <text x="240" y="226" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 离桌 10cm 直接规划转姿运输</text>
  <text x="240" y="246" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• ≥81 点 (≤0.01rad) + 321点扫掠</text>
  <text x="240" y="270" fill="#2dd4bf" font-family="monospace" font-size="11">拦截旧粗采样撞箱壁隐患</text>

  <!-- Node 3: v39-v43 -->
  <circle cx="535" cy="138" r="10" fill="#818cf8" stroke="#0f172a" stroke-width="3"/>
  <text x="535" y="116" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="14" font-weight="700">v39 → v43</text>
  <rect x="431" y="160" width="195" height="125" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="443" y="184" fill="#f8fafc" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">安全退回走廊与第二件 C</text>
  <text x="443" y="206" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 末端插值退回路线通过实测</text>
  <text x="443" y="226" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 发现双 C 第二件余量仅 2.84mm</text>
  <text x="443" y="246" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• v43 硬拉 7mm 导致规划无解</text>
  <text x="443" y="270" fill="#818cf8" font-family="monospace" font-size="11">催生软目标优化器架构</text>

  <!-- Node 4: v46-v47 -->
  <circle cx="755" cy="138" r="10" fill="#f59e0b" stroke="#0f172a" stroke-width="3"/>
  <text x="755" y="116" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="700">v46 → v47</text>
  <rect x="644" y="160" width="205" height="125" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="656" y="184" fill="#f8fafc" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">落稳余量软优化与 A 内收</text>
  <text x="656" y="206" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 保留 3mm+2mm 硬下限，软优 7.05mm</text>
  <text x="656" y="226" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 双 C 新场景生产+独立五帧通过</text>
  <text x="656" y="246" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• A 释放点内收 20mm、侧边距 25mm</text>
  <text x="656" y="270" fill="#f59e0b" font-family="monospace" font-size="11">解决 A 贴壁 (-0.64mm) 问题</text>

  <!-- Node 5: v48 -->
  <circle cx="960" cy="138" r="12" fill="#10b981" stroke="#0f172a" stroke-width="3"/>
  <text x="960" y="116" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="14" font-weight="700">v48 (当前冻结)</text>
  <rect x="865" y="160" width="180" height="125" rx="8" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-width="1.5"/>
  <text x="877" y="184" fill="#ecfdf5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">保落稳余量 + 扩持物余量</text>
  <text x="877" y="206" fill="#d1fae5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 人工确认物理落箱 6/6</text>
  <text x="877" y="226" fill="#d1fae5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 全流程耗时 2848.2s (&lt;3011.9s)</text>
  <text x="877" y="246" fill="#d1fae5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">• 202/202 离线回归全绿</text>
  <text x="877" y="270" fill="#34d399" font-family="monospace" font-size="11">自动账本因 3mm 阈值记 5/6</text>

  <!-- Bottom Left Panel: v48 Timing Breakdown -->
  <rect x="35" y="308" width="495" height="176" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="55" y="336" fill="#f8fafc" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">候选 v48 实测耗时分解 (总耗时 2848.21s ≈ 47.5 分钟)</text>
  <text x="55" y="356" fill="#94a3b8" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">优于历史基准 3011.92s（提速约 163.7 秒），数据源：docs/validation/seed0-summary.json</text>

  <!-- Bars -->
  <text x="55" y="386" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">机械臂运动执行 (Motion)</text>
  <rect x="210" y="373" width="215" height="16" rx="4" fill="url(#barMotion)"/>
  <text x="433" y="386" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">1738.1s (61.0%)</text>

  <text x="55" y="414" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">轨迹与释放规划 (Planning)</text>
  <rect x="210" y="401" width="124" height="16" rx="4" fill="url(#barPlan)"/>
  <text x="342" y="414" fill="#818cf8" font-family="monospace" font-size="12" font-weight="600">999.8s (35.1%)</text>

  <text x="55" y="442" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">RGB-D 视觉感知 (Perception)</text>
  <rect x="210" y="429" width="14" height="16" rx="4" fill="#14b8a6"/>
  <text x="232" y="442" fill="#2dd4bf" font-family="monospace" font-size="12" font-weight="600">53.8s (1.9%)</text>

  <text x="55" y="468" fill="#cbd5e1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">多帧落箱核验 (Verification)</text>
  <rect x="210" y="455" width="8" height="16" rx="4" fill="#10b981"/>
  <text x="226" y="468" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">23.7s (0.8%)</text>

  <!-- Bottom Right Panel: v48 C-Bin Boundary Diagnosis -->
  <rect x="550" y="308" width="495" height="176" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="570" y="336" fill="#f8fafc" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">为什么物理 6/6 完成，自动账本却记 5/6？（c48 边界诊断）</text>
  <text x="570" y="356" fill="#94a3b8" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">数据源：docs/validation/c48-landing-diagnosis.json · 坚持客观证据，不篡改原始失败回执</text>

  <rect x="570" y="370" width="455" height="98" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="586" y="392" fill="#e2e8f0" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">1. 释放前验证：两件 C 均连续 3 帧通过持物净空检验（min_mm: 4.29~5.88mm &gt; 5mm 阈值）。</text>
  <text x="586" y="416" fill="#e2e8f0" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">2. 落箱后检测：末段连续 7 帧 (125~143) 均成功分离并检出 C 箱内存在 2 件螺丝刀。</text>
  <text x="586" y="440" fill="#fbbf24" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">3. 阈值卡点：其中一件估计轮廓距箱腔内缩边界余量在 3.12mm ↔ -0.19mm 间微幅波动，</text>
  <text x="586" y="458" fill="#fbbf24" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12">   7 帧中有 6 帧略低于严苛的 3.00mm 包含阈值，导致自动账本诚实停在 5/6。</text>
</svg>
